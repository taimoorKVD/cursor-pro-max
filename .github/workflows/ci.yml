name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q --tb=line --ignore=tests/browser
        env:
          ORCH_QUOTAS: "false"
          DRY_RUN: "true"
          DEPLOY_ENABLED: "false"
          ORCHESTRATOR_WORKER: "false"
          TELEGRAM_POLLING_ENABLED: "false"
          WEBHOOK_REPLY_ENABLED: "false"
